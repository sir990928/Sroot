name: Build CVE Payload AYA1
on:
  push:
    branches: [ main ]
    paths:
      - "src/**"
      - "Makefile"
      - ".github/workflows/build-payload.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TARGET_NAME: pa3q-S9380ZHU1AYA1
    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 安装依赖工具
        run: sudo apt update && sudo apt install -y make wget unzip zip

      - name: 下载并解压 NDK r27 (Google官方源)
        run: |
          wget https://dl.google.com/android/repository/android-ndk-r27-linux.zip
          unzip -q android-ndk-r27-linux.zip
          echo "ANDROID_NDK_HOME=$PWD/android-ndk-r27" >> $GITHUB_ENV

      - name: 校验NDK编译器
        run: |
          CLANG_PATH=${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android-clang
          echo "编译器路径: $CLANG_PATH"
          test -x "$CLANG_PATH" || { echo "错误：编译器不存在！NDK包损坏"; exit 1; }

      - name: 编译漏洞程序
        run: |
          CLANG_BIN="${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android-clang"
          make CLANG="${CLANG_BIN}" TARGET=${{ env.TARGET_NAME }} API=35 all

      - name: 打包编译产物ZIP
        run: zip -r payload-build.zip build/

      - name: 上传制品压缩包
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.TARGET_NAME }}-build-zip
          path: payload-build.zip
          retention-days: 30
